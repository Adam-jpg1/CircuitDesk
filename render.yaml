services:
  - type: web
    name: circuitdesk-compiler
    runtime: docker
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    # Deploy from main, explicitly. The service was once left tracking a
    # working branch, and when that branch was renamed it silently stopped
    # deploying anything at all.
    branch: main
    envVars:
      - key: NODE_ENV
        value: production
      # Optional: extra CORS origins (comma-separated), e.g. Vercel preview URLs.
      - key: CORS_EXTRA_ORIGINS
        value: ""
      # Community (see docs/community.md). CREATOR_TOKEN grants the Creator
      # badge when publishing; set it in the dashboard, never in this file.
      - key: CREATOR_TOKEN
        sync: false
      # Where shared projects and likes are kept: on the persistent disk below,
      # which survives deploys and restarts. /health reports
      # communityStorage.persistent, so a deploy can be checked.
      - key: COMMUNITY_DATA_DIR
        value: /var/data/community
    # Everything people publish to the community, and every like, lives here.
    # The container's own filesystem is replaced at each deploy; this disk is
    # not. Render snapshots it daily. (A service with a disk runs as a single
    # instance and restarts rather than overlapping during a deploy — the
    # server writes any pending change on SIGTERM before it stops.)
    disk:
      name: community-data
      mountPath: /var/data
      sizeGB: 1
