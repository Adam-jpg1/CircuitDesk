services:
  - type: web
    name: circuitdesk-compiler
    runtime: docker
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    # Deploy from main, explicitly. The service was once left tracking a
    # working branch, and when that branch was renamed it silently stopped
    # deploying anything at all.
    branch: main
    envVars:
      - key: NODE_ENV
        value: production
      # Optional: extra CORS origins (comma-separated), e.g. Vercel preview URLs.
      - key: CORS_EXTRA_ORIGINS
        value: ""
      # Community (see docs/community.md). CREATOR_TOKEN grants the Creator
      # badge when publishing; set it in the dashboard, never in this file.
      - key: CREATOR_TOKEN
        sync: false
      # Where shared projects and likes are kept: a hosted Postgres (Neon).
      # Set it in the dashboard (Environment -> DATABASE_URL), never in this
      # file. The server applies pending migrations when it starts; the data
      # lives with the database, so deploys, restarts and the service sleeping
      # never touch it. /health reports communityStorage.persistent.
      - key: DATABASE_URL
        sync: false
